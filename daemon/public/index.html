<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>team-claude — participant</title>
  <script>try{var t=localStorage.getItem("team-claude.theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header>
    <h1>team-claude</h1>
    <span id="session-name" class="muted">connexion…</span>
    <span class="spacer"></span>
    <span id="status" class="status status-offline" role="status" aria-live="polite">offline</span>
  </header>

  <main>
    <section id="claude-stream">
      <h2>Claude</h2>
      <ul id="stream-list" class="muted" aria-live="polite" aria-label="Flux Claude en direct">(en attente…)</ul>
      <div id="thinking" class="thinking hidden" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <span class="thinking-verb">Réfléchit</span><span class="thinking-dots">…</span>
      </div>
    </section>

    <section id="compose">
      <h2>Ton message</h2>
      <div id="identity">
        <label for="name" id="name-field">Ton nom
          <input id="name" placeholder="Ton prénom…" autocomplete="name">
        </label>
        <p id="identity-chip" class="identity-chip hidden"></p>
      </div>
      <div class="composer">
        <label for="body" class="hidden">Message</label>
        <textarea id="body" rows="2" placeholder="Écris quelque chose à l'équipe…"></textarea>
        <div class="composer-bar">
          <span class="composer-hint muted" aria-hidden="true">⏎ Ctrl/Cmd + Entrée pour envoyer</span>
          <button id="send-btn" type="button" disabled>Envoyer <span aria-hidden="true">➤</span></button>
        </div>
      </div>
    </section>
  </main>

  <script src="/app.js" type="module"></script>
</body>
</html>
