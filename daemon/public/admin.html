<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>team-claude — admin</title>
  <script>try{var t=localStorage.getItem("team-claude.theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header>
    <h1>team-claude · admin</h1>
    <span id="session-name" class="muted">…</span>
    <a id="participant-stream-link" class="muted">→ stream live</a>
    <span class="spacer"></span>
    <span id="status" class="status status-offline" role="status" aria-live="polite">checking…</span>
  </header>

  <main>
    <section>
      <h2>Invitations</h2>
      <div class="actions-row" style="margin-bottom: 1rem">
        <input id="intended-for" type="text" maxlength="32" aria-label="Nom prévu pour l'invitation"
               placeholder="Pour qui ? (optionnel — pré-rempli côté participant)" style="flex:1;min-width:14rem">
        <button id="mint-btn" type="button">+ Générer un nouveau code</button>
        <button id="reload-btn" type="button" class="btn-ghost">↻ Recharger</button>
        <span class="muted" id="auto-refresh-hint">auto-refresh: 5s</span>
        <span id="loading" class="loading-bar hidden" aria-hidden="true" style="flex:1 0 100%"></span>
      </div>
      <div class="table-wrap">
        <table id="invites-table">
          <thead>
            <tr><th scope="col">Code</th><th scope="col">Pour</th><th scope="col">Créé</th><th scope="col">URL à partager</th><th scope="col">État</th><th scope="col">Actions</th></tr>
          </thead>
          <tbody id="invites-body"><tr><td colspan="6" class="muted">(chargement…)</td></tr></tbody>
        </table>
      </div>
    </section>

    <section>
      <h2>Participants</h2>
      <div class="table-wrap">
        <table id="participants-table">
          <thead>
            <tr><th scope="col">Pseudo</th><th scope="col">Invité·e en tant que</th><th scope="col">Joined</th><th scope="col">Last seen</th><th scope="col">Conn.</th><th scope="col">IP</th><th scope="col">État</th><th scope="col">Action</th></tr>
          </thead>
          <tbody id="participants-body"><tr><td colspan="8" class="muted">(chargement…)</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/admin.js" type="module"></script>
</body>
</html>
