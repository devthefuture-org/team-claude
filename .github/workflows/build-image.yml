name: Build & push images

on:
  push:
    branches:
      - main
    paths:
      - 'images/devcontainer/**'
      - 'images/code-server/**'
      - 'daemon/**'
      - 'extension/**'
      - '.github/workflows/build-image.yml'
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: team-claude-devcontainer
            context: images/devcontainer
            file:    images/devcontainer/Dockerfile
          - name: team-claude-code-server
            context: .
            file:    images/code-server/Dockerfile
          - name: team-claude-host
            context: daemon
            file:    daemon/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          pull: true   # always re-pull FROM-base images so :latest stays fresh
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          platforms: linux/amd64

  validate-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /tmp
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Lint charts
        run: |
          helm lint chart/team-claude
          helm lint chart/team-claude-base

      - name: Validate session chart (full config)
        run: |
          helm template demo chart/team-claude \
            --namespace team-claude \
            --set session.name=demo \
            --set domain=shared-coding-session.devthefuture.org \
            --set daemon.enabled=true \
            --set ssh.enabled=true \
            --set "ssh.authorizedKeys[0]=ssh-ed25519 AAAAtest test@host" \
            | kubeconform -summary -strict -ignore-missing-schemas

      - name: Validate base chart
        run: |
          helm template base chart/team-claude-base \
            --namespace team-claude \
            | kubeconform -summary -strict -ignore-missing-schemas
