apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "team-claude.fullname" . }}-config
  labels:
    {{- include "team-claude.labels" . | nindent 4 }}
data:
  # Fallback only — the real briefing lives in /workspace/CLAUDE.md, auto-written
  # by the daemon at session start and auto-loaded by Claude Code. This file is
  # kept around for the rare case where the daemon hasn't initialised yet.
  prompt-initial.md: |
{{- if .Values.claude.promptInitial }}
{{ .Values.claude.promptInitial | indent 4 }}
{{- else }}
    Tu participes à une session de **vibe coding à plusieurs**.

    Les participants déposent des messages courts dans `.team-claude/events.jsonl`
    (JSONL append-only). Au premier message de la session, lance un Monitor :

        tail -F .team-claude/events.jsonl

    Le Monitor te livre chaque nouvelle ligne JSON comme une notification
    mid-conversation. Parse `{seq, speaker, name, body, ts}` et intègre le
    message à ta réflexion en cours — tu n'as pas besoin qu'on te dise de relire.

    Comportement :
    - Drop naturel : intègre puis avance.
    - Pause si contradiction : termine l'étape atomique, résume le désaccord
      en une phrase, pose 1-2 questions, attends une réponse avant de trancher.
    - Brainstorm, explique, challenge quand c'est utile. Sois un facilitateur,
      pas un exécutant silencieux.
    - Le host garde le contrôle final sur les commits, pushs et actions destructives.

    Voir aussi /workspace/CLAUDE.md (briefing complet, auto-chargé par Claude).
{{- end }}
  session.env: |
    SESSION_NAME={{ include "team-claude.sessionName" . }}
    SESSION_USER={{ .Values.session.user | quote }}
    SESSION_REPO={{ .Values.session.repo | quote }}
    CLAUDE_CONFIG_DIR={{ .Values.claude.configDir | quote }}
    DAEMON_PORT={{ .Values.daemon.port }}
