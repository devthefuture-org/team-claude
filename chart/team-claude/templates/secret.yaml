{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-auth" (include "team-claude.fullname" .)) -}}
{{- $codePwd := "" -}}
{{- $roomTok := "" -}}
{{- if $existing -}}
{{- $codePwd = index $existing.data "codeServerPassword" | b64dec -}}
{{- $roomTok = index $existing.data "roomToken" | b64dec -}}
{{- end -}}
{{- if .Values.auth.codeServerPassword -}}
{{- $codePwd = .Values.auth.codeServerPassword -}}
{{- else if not $codePwd -}}
{{- $codePwd = randAlphaNum 24 -}}
{{- end -}}
{{- if .Values.auth.roomToken -}}
{{- $roomTok = .Values.auth.roomToken -}}
{{- else if not $roomTok -}}
{{- $roomTok = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "team-claude.fullname" . }}-auth
  labels:
    {{- include "team-claude.labels" . | nindent 4 }}
type: Opaque
stringData:
  codeServerPassword: {{ $codePwd | quote }}
  roomToken: {{ $roomTok | quote }}
  roomUrl: {{ printf "https://%s/?token=%s" (include "team-claude.daemonHost" .) $roomTok | quote }}
{{- if and .Values.ssh.enabled .Values.ssh.authorizedKeys }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "team-claude.fullname" . }}-ssh
  labels:
    {{- include "team-claude.labels" . | nindent 4 }}
type: Opaque
stringData:
  authorized_keys: |
    {{- range .Values.ssh.authorizedKeys }}
    {{ . }}
    {{- end }}
{{- end }}
