session:
  name: ""
  user: ""
  repo: ""

domain: example.com

hosts:
  codeServer: ""
  daemon: ""

ingress:
  enabled: true
  className: haproxy
  # Defaults target jcmoraisjr/haproxy-ingress (controller
  # haproxy-ingress.github.io/controller). code-server WebSockets and the
  # daemon WS need long timeouts; bump body size for VS Code extension installs.
  annotations:
    haproxy-ingress.github.io/timeout-client: 1h
    haproxy-ingress.github.io/timeout-server: 1h
    haproxy-ingress.github.io/proxy-body-size: 100m
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod
    wildcard: false
    secretName: ""

persistence:
  enabled: true
  storageClassName: ""
  size: 20Gi
  accessModes:
    - ReadWriteOnce
  reclaimPolicy: Retain

devcontainer:
  image:
    repository: ghcr.io/devthefuture-org/team-claude-devcontainer
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 8Gi
  extraEnv: []

codeServer:
  enabled: true
  port: 8080
  image:
    repository: codercom/code-server
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

daemon:
  enabled: false
  port: 7000
  healthPath: /healthz
  wsPath: /ws
  image:
    repository: ghcr.io/devthefuture-org/team-claude-host
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

ssh:
  enabled: false
  authorizedKeys: []
  serviceType: ClusterIP
  nodePort: ""

auth:
  codeServerPassword: ""
  roomToken: ""

claude:
  configDir: /home/devbox/.claude
  promptInitial: ""

tmuxSocket: /home/devbox/.tmux-claude/socket

networkPolicy:
  enabled: true
  allowDNS: true
  allowEgressInternet: true
  # Namespaces hosting the ingress controller — adapt to your cluster.
  ingressNamespaces:
    - haproxy-ingress
    - kube-system

serviceAccount:
  create: true
  annotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
