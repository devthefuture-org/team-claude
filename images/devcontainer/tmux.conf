set -g default-terminal "screen-256color"
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1

# Use plugin install location baked into the image (survives PVC mount over $HOME).
set-environment -g TMUX_PLUGIN_MANAGER_PATH '/opt/tmux-plugins'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
# Persist resurrect snapshots on the PVC.
set -g @resurrect-dir '/home/devbox/.claude/tmux-resurrect'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

run -b '/opt/tmux-plugins/tpm/tpm'
